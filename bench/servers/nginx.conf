# nginx server block for a wp-test fixture — axis 2, "same PHP" pass.
#
# Substitute:
#   __DOMAIN__      bench.example.com
#   __DOCROOT__     /home/<account>/public_html
#   __FPM_SOCKET__  /run/php84-php-fpm/<account>.sock   (the pool corehttpd uses)
#   __CERT__ / __KEY__
#
# The FastCGI socket must be the pool that is *already running* for this
# account. Do not create a second pool for nginx: the whole argument of axis 2
# is that PHP is the same process in every pass.
#
# nginx must be able to reach the socket. CorePanel's pools are typically owned
# by the account and grouped to the web server user, so either run nginx as that
# same user for the duration of the pass, or add it to the group — and note
# which, because it is part of the configuration being reported.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name __DOMAIN__;
    root __DOCROOT__;
    index index.php index.html;

    ssl_certificate     __CERT__;
    ssl_certificate_key __KEY__;

    # Compression is OFF in stock nginx. Leaving this commented gives the
    # "as-shipped" pass; uncommenting gives the "levelled" pass. Never report
    # both under one label — see README.md.
    # gzip on;
    # gzip_types text/css application/javascript application/json image/svg+xml;
    # gzip_min_length 1024;
    # gzip_comp_level 5;

    # Big enough that a 235 KB builder page is not chopped into many writes,
    # which would measure buffer tuning rather than the server.
    fastcgi_buffers 16 32k;
    fastcgi_buffer_size 64k;

    client_max_body_size 64m;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass unix:__FPM_SOCKET__;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 120s;
    }

    # Static assets. No expires header on purpose: adding one here and not in
    # the other servers' configs would change what a repeat visit costs. If you
    # want caching headers, add the equivalent everywhere and say so.
    location ~* \.(jpg|jpeg|png|gif|webp|css|js|woff2?|svg|ico)$ {
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location ~ /\.          { deny all; }
}
