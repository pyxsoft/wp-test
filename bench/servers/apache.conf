# Apache vhost for a wp-test fixture — axis 2, "same PHP" pass.
#
# Substitute:
#   __DOMAIN__      bench.example.com
#   __DOCROOT__     /home/<account>/public_html
#   __FPM_SOCKET__  /run/php84-php-fpm/<account>.sock   (the pool corehttpd uses)
#   __CERT__ / __KEY__
#
# Use MPM **event** with mod_proxy_fcgi. That is Apache's sensible modern
# configuration, and it is what a fair comparison requires.
#
# Do NOT benchmark prefork + mod_cgi here. That combination is what some control
# panels still ship by default, and measuring it against a modern engine is a
# straw man: it forks a PHP process per request and, without opcache, recompiles
# the whole application every time. If you want that number, it belongs to the
# panel-vs-panel axis, labelled as a panel default — not to this one.
#
# Required modules: mpm_event, ssl, http2, proxy, proxy_fcgi, rewrite
# (and deflate only for the "levelled" pass).

<VirtualHost *:443>
    ServerName __DOMAIN__
    DocumentRoot __DOCROOT__

    SSLEngine on
    SSLCertificateFile    __CERT__
    SSLCertificateKeyFile __KEY__
    Protocols h2 http/1.1

    <Directory __DOCROOT__>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # WordPress pretty permalinks, expressed here rather than in .htaccess:
        # AllowOverride None avoids a stat() per directory per request, which
        # would penalise Apache for a reason unrelated to what we are measuring.
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.php$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.php [L]
    </Directory>

    # Hand .php to the same pool every other pass uses.
    <FilesMatch \.php$>
        SetHandler "proxy:unix:__FPM_SOCKET__|fcgi://localhost/"
    </FilesMatch>

    ProxyTimeout 120

    # Compression: enabled per configuration, unlike nginx where it is off by
    # default. Keep this commented for the "as-shipped" pass and enable it for
    # the "levelled" one — matching whatever the other servers are doing.
    # <IfModule mod_deflate.c>
    #     AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml
    # </IfModule>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    ErrorLog /var/log/httpd/bench_error.log
    # Logging costs measurable time under load. Off here, and it must be off
    # (or on) in every pass alike.
    CustomLog /dev/null combined
</VirtualHost>
